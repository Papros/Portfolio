<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host +
        l.pathname.split('/').slice(0, segmentCount + 1).join('/') +
        '/?redirect=' + encodeURIComponent(
          l.pathname.split('/').slice(segmentCount + 1).join('/') +
          l.search + l.hash
        )
      );
    </script>
  </head>
</html>
